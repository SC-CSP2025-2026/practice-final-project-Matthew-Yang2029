<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Start Page -->
    <div id="start-page" class="container mt-5">
      <h1 class="text-center mb-5">Game Quiz</h1>
      <div class="row justify-content-center">
        <div class="col-md-8">
          <p class="text-center lead mb-4">Choose your quiz type:</p>
          <div class="row g-4">
            <div class="col-md-6">
              <div class="card mode-card" id="multiple-choice-btn">
                <div class="card-body text-center py-5">
                  <h2 class="card-title mb-3">Multiple Choice</h2>
                  <p class="card-text text-muted">Answer questions with 4 options to choose from</p>
                </div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="card mode-card" id="true-false-btn">
                <div class="card-body text-center py-5">
                  <h2 class="card-title mb-3">True or False</h2>
                  <p class="card-text text-muted">Decide if statements are true or false</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Quiz Page (Hidden by default) -->
    <div id="quiz-page" class="d-none">
      <h1 class="text-center">Game Quiz</h1>
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-md-8">
            <!-- Progress -->
            <p class="text-center text-muted mb-3" id="progress">Question 1 of 7</p>

            <!-- Question Card -->
            <div class="card mb-4">
              <div class="card-body text-center">
                <span class="badge bg-primary fs-6 mb-3 d-none" id="game-name"></span>
                <h2 class="card-title" id="question">
                  Loading question...
                </h2>
              </div>
            </div>

            <!-- Answer Boxes (Multiple Choice) -->
            <div id="multiple-choice-answers" class="row g-3">
              <div class="col-6">
                <div class="card answer-box" data-answer="A">
                  <div class="card-body text-center">
                    <h5 class="card-text" id="answer-a">A. Option A</h5>
                  </div>
                </div>
              </div>
              <div class="col-6">
                <div class="card answer-box" data-answer="B">
                  <div class="card-body text-center">
                    <h5 class="card-text" id="answer-b">B. Option B</h5>
                  </div>
                </div>
              </div>
              <div class="col-6">
                <div class="card answer-box" data-answer="C">
                  <div class="card-body text-center">
                    <h5 class="card-text" id="answer-c">C. Option C</h5>
                  </div>
                </div>
              </div>
              <div class="col-6">
                <div class="card answer-box" data-answer="D">
                  <div class="card-body text-center">
                    <h5 class="card-text" id="answer-d">D. Option D</h5>
                  </div>
                </div>
              </div>
            </div>

            <!-- Answer Boxes (True/False) -->
            <div id="true-false-answers" class="row g-3 d-none">
              <div class="col-6">
                <div class="card answer-box" data-answer="true">
                  <div class="card-body text-center py-4">
                    <h3 class="card-text text-success">True</h3>
                  </div>
                </div>
              </div>
              <div class="col-6">
                <div class="card answer-box" data-answer="false">
                  <div class="card-body text-center py-4">
                    <h3 class="card-text text-danger">False</h3>
                  </div>
                </div>
              </div>
            </div>

            <!-- Play Again Text -->
            <p class="text-center mt-4" id="play-again"></p>

            <!-- Navigation Buttons -->
            <div class="text-center mt-4">
              <button id="next-btn" class="btn btn-primary d-none">Next Question</button>
              <button id="back-btn" class="btn btn-outline-secondary">Back to Start</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
